<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Beautiful deep midnight/indigo/dark violet background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Heart & Love (Piyaa) Gradient -->
    <linearGradient id="piyaaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Star & Sparkle Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    
    <!-- Shield / Achievement Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <!-- Glowing background aura -->
  <circle cx="256" cy="230" r="140" fill="#EC4899" opacity="0.15" filter="blur(40px)" />
  <circle cx="256" cy="230" r="100" fill="#2DD4BF" opacity="0.15" filter="blur(30px)" />

  <!-- Outer Ring (CA / Academic Excellence) -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-dasharray="12 6" opacity="0.8"/>
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Academic Graduation Cap Intertwined with Hearts -->
  <!-- Cap Diamond Board -->
  <polygon points="256,120 370,165 256,210 142,165" fill="url(#piyaaGrad)" opacity="0.95"/>
  <!-- Cap Tassel -->
  <path d="M 370 165 L 385 220 L 380 235" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="380" cy="235" r="5" fill="url(#goldGrad)"/>
  <!-- Cap Base / Skullcap -->
  <path d="M 190 192 L 190 230 C 190 270, 322 270, 322 230 L 322 192" fill="url(#tealGrad)" opacity="0.85"/>

  <!-- Central Intertwined Love Hearts (Piyaa Study Companion) -->
  <path d="M 256 215 C 230 180, 180 180, 180 220 C 180 260, 256 310, 256 310 C 256 310, 332 260, 332 220 C 332 180, 282 180, 256 215 Z" fill="url(#piyaaGrad)" opacity="0.9" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Sparkles -->
  <!-- Top Left Sparkle -->
  <path d="M 110 130 Q 125 130 125 115 Q 125 130 140 130 Q 125 130 125 145 Q 125 130 110 130 Z" fill="url(#goldGrad)"/>
  <!-- Top Right Sparkle -->
  <path d="M 370 110 Q 385 110 385 95 Q 385 110 400 110 Q 385 110 385 125 Q 385 110 370 110 Z" fill="url(#goldGrad)"/>

  <!-- Brand Text -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">PIYAA</text>
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#2DD4BF" text-anchor="middle" letter-spacing="4">CA FINAL COMPANION</text>
</svg>
